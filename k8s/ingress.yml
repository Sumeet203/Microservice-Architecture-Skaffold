apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: microservice-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: microservice.local
      http:
        paths:
          - path: /api/core
            pathType: Prefix
            backend:
              service:
                name: core-service
                port:
                  number: 3000

          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 3001